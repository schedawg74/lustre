packages:
  - src/apps/*
  - src/packages/*
  - src/tooling/*
# Versions of external dependencies that two or more manifests use.
catalog:
  '@types/node': 26.6.5
  '@types/react': 19.3.0
  '@tailwindcss/vite': 4.3.3
  '@types/react-dom': 19.3.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  typescript: 7.0.2
  vitest: 5.0.5
catalogMode: prefer
allowBuilds:
  esbuild: true
  '@biomejs/biome': true
  spawn-sync: false
# Resolve only versions that are at least 12 hours old.
minimumReleaseAge: 720
nodeLinker: hoisted
